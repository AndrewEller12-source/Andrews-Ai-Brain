name: Publish verified 0.14.3
on:
  push:
    paths: ['.github/workflows/publish-0.14.3.yml']
permissions:
  contents: write
concurrency:
  group: publish-0.14.3
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and verify signed release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir assets
          cd assets
          while read -r f size; do
            : > "$f"
            for ((start=0; start<size; start+=4194304)); do
              end=$((start+4194303))
              if ((end>=size)); then end=$((size-1)); fi
              curl --silent --show-error --http1.1 --fail --location --retry 20 --retry-all-errors --retry-delay 3 --max-time 40 --range "$start-$end" "https://handhelds-sofa-gourmet-smoke.trycloudflare.com/$f" -o transfer.part
              test "$(wc -c < transfer.part)" -eq "$((end-start+1))"
              cat transfer.part >> "$f"
            done
            echo "Downloaded $f"
          done <<'RELEASE_FILES'
          Ai-Task-Manager-Mac-0.14.3.zip 154713133
          Ai-Task-Manager-Migration-0.14.3.pkg 154319767
          Ai-Task-Manager-Source-0.14.3.zip 576445
          SHA256SUMS.txt 464
          appcast-neutral.xml 921
          appcast.xml 995
          RELEASE_FILES
          rm transfer.part
          echo '65ef91ca21d80e52f03e88beb97fbd5af948553cf3d123697d7078e0e544e0b2  Ai-Task-Manager-Mac-0.14.3.zip' | sha256sum -c -
          echo '089585cd3aefa5b7dc6ebcfc18674d3170b736b54744c68d79e2a0672e72c3ef  Ai-Task-Manager-Source-0.14.3.zip' | sha256sum -c -
          echo '85dda60e6dc8dee63d0c6690c27687a4d39ead0876b1c14a87315e87467a2a81  Ai-Task-Manager-Migration-0.14.3.pkg' | sha256sum -c -
          echo '5017a8567a2e1c4f6d28c1e1682295e349ef63cd0b4aa90164128c78c1616db5  appcast.xml' | sha256sum -c -
          echo '6477a90c4b9d4bcab52556e1a946b7f60bb7a1fc2fff6c936675fbb6023f77b4  appcast-neutral.xml' | sha256sum -c -
          echo 'cbb50d69fc8c287495df7ad4644501734ff7ab25e864d6cb63cfd60fbc01e8e9  SHA256SUMS.txt' | sha256sum -c -
          sha256sum -c SHA256SUMS.txt
      - uses: actions/checkout@v4
        with:
          path: checkout
      - name: Import reviewed editable source
        run: |
          set -euo pipefail
          unzip -q assets/Ai-Task-Manager-Source-0.14.3.zip -d /tmp/reviewed-source
          rsync -a --delete --exclude=.git --exclude=.github /tmp/reviewed-source/Ai-Task-Manager-Source/ checkout/
          cd checkout
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Publish GOD CHAT coordination and scoped agent responsibilities in 0.14.3'
          git push
      - name: Upload draft and publish complete update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          target=$(git -C checkout rev-parse HEAD)
          gh release create v0.14.3 assets/* --target "$target" --draft --title 'Ai Task Manager 0.14.3' --notes 'Adds GOD CHAT to the sidebar and universe map. Coordinate gives available employees specific non-overlapping assignments based on their roles and department goals. Broadcast sends the exact owner message to every eligible chat, including confirmed active-turn steering. Each recipient has a saved assignment and delivery receipt; paused, stopped, unavailable and unconfirmed work is shown for review. Agent roles, goals and completion conditions, plus department business goals, are editable and isolated by universe. Department managers also receive this context. Interrupted rounds retain receipts without automatically sending duplicates. Fixes engine version reporting. Functional, integration, account-isolation and privacy tests passed; signed final assets passed the private-data scan. Existing workspace data remains in place. Older app identities use the signed migration installer, which may request Mac administrator authorization. Installation waits for unfinished dashboard work.'
          gh release edit v0.14.3 --draft=false --latest
