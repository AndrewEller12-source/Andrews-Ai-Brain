name: Publish verified 0.10.0
on:
  push:
    paths: ['.github/workflows/publish-0.10.0.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir assets
          cd assets
          for f in Ai-Task-Manager-Mac-0.10.0.zip Ai-Task-Manager-Source-0.10.0.zip appcast.xml SHA256SUMS.txt; do
            curl --fail --location --retry 3 --max-time 300 "https://fraction-sequence-dna-richard.trycloudflare.com/$f" -o "$f"
          done
          echo '3df3f42c8cab835ff3a8f91ded70172b2e0172b040fea7cbb755e25d806a446f  Ai-Task-Manager-Mac-0.10.0.zip' | sha256sum -c -
          echo '84c5f48b51779e3b4ab2f249266fed6df5df030a2dff8c107f31c21f55be8a59  Ai-Task-Manager-Source-0.10.0.zip' | sha256sum -c -
          echo '0bcb631bf7daba92da9de866beaa135e2b5db6c73a7fe409c910b4889a397c40  appcast.xml' | sha256sum -c -
          echo '68bf66641fbbbf021482cf67c25f095b34756f6976c847268b04a125451e7fb4  SHA256SUMS.txt' | sha256sum -c -
          sha256sum -c SHA256SUMS.txt
      - name: Publish signed Mac update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v0.10.0 assets/* --title 'Ai Task Manager 0.10.0' --latest --notes 'Active conversations can now be steered immediately into the exact running turn instead of waiting behind it. Each steer has a durable, idempotent delivery receipt and stale or unconfirmed delivery fails closed. The Workspace menu and settings now link directly to the official Codex cloud and ChatGPT sites while keeping remote history distinct from local task history. Packaging now derives artifact names from the app version. Verified with all 204 tests, a successful macOS Release build, strict code-signature validation, archive integrity checks, and signed Sparkle updater metadata. Signed Mac update and editable source included.'
      - uses: actions/checkout@v4
        with:
          path: checkout
      - name: Import reviewed editable source
        run: |
          unzip -q assets/Ai-Task-Manager-Source-0.10.0.zip -d /tmp/reviewed-source
          cp -a /tmp/reviewed-source/Ai-Task-Manager-Source/. checkout/
          cd checkout
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Publish immediate steering and OpenAI site access in 0.10.0'
          git push
