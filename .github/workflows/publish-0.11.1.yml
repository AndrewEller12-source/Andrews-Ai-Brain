name: Publish verified 0.11.1
on:
  push:
    paths: ['.github/workflows/publish-0.11.1.yml']
permissions:
  contents: write
concurrency:
  group: publish-0.11.1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify signed release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir assets
          cd assets
          for f in Ai-Task-Manager-Mac-0.11.1.zip Ai-Task-Manager-Source-0.11.1.zip appcast.xml SHA256SUMS.txt; do
            curl --fail --location --retry 3 --max-time 300 "https://projects-panels-includes-examining.trycloudflare.com/$f" -o "$f"
          done
          echo '9f2816f9264b84c153d3e1c28e791e18ce1cac96a58240e807228e5b81186e3a  Ai-Task-Manager-Mac-0.11.1.zip' | sha256sum -c -
          echo '62d5410a26b990cf8390e9b22b38696228aa60f400a90e661397d5eec9a1a912  Ai-Task-Manager-Source-0.11.1.zip' | sha256sum -c -
          echo 'e5a3289327de7612ba4720f3f5b38a14df3f45f64495b5fbabf6a766051fbe77  appcast.xml' | sha256sum -c -
          echo '7854ce0ce25b348eb4a9c7ac5f10b8c3cb99056f9510f9dbebfde2e58edf3ca9  SHA256SUMS.txt' | sha256sum -c -
          sha256sum -c SHA256SUMS.txt
      - uses: actions/checkout@v4
        with:
          path: checkout
      - name: Import reviewed editable source
        run: |
          set -euo pipefail
          unzip -q assets/Ai-Task-Manager-Source-0.11.1.zip -d /tmp/reviewed-source
          cp -a /tmp/reviewed-source/Ai-Task-Manager-Source/. checkout/
          cd checkout
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Publish universe isolation, recovery and task control improvements in 0.11.1'
          git push
      - name: Upload draft and publish complete update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          target=$(git -C checkout rev-parse HEAD)
          gh release create v0.11.1 assets/* --target "$target" --draft --title 'Ai Task Manager 0.11.1' --notes 'Keeps separate businesses separate: stricter evidence-based universe discovery waits for specific context and rechecks old automatic matches. Delete and restore universes without deleting chats, files or active work. Pending questions stay visible across universes. Choose Queue this or Steer now explicitly; steering never silently becomes queued work. Send now is directly available on waiting inbox rows. Rewster voice turns and internal reviews no longer flood Completions. Universe branches show live and review counts together, with decorative motion separate from live status. Switching universes clears old reply labels. Verified with regression checks, isolated browser question/steering/dispatch/delete/restore flows, clean recipient and final packaged-runtime checks, code signing and Sparkle signature verification. Reuses the verified native shell with unchanged Swift source; native compiler did not complete on the build host. Signed Mac update, editable source and first-use product review included.'
          gh release edit v0.11.1 --draft=false --latest
