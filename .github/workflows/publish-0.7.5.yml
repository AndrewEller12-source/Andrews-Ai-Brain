name: Publish verified 0.7.5
on:
  push:
    paths: ['.github/workflows/publish-0.7.5.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir assets
          cd assets
          for f in Ai-Task-Manager-Mac-0.7.5.zip Ai-Task-Manager-Source-0.7.5.zip appcast.xml SHA256SUMS.txt; do
            curl --fail --location --retry 3 --max-time 300 "https://customized-indie-occupations-assets.trycloudflare.com/$f" -o "$f"
          done
          echo '7dab4ad7449e3ea8a0afbf4dc418031d8217df95930f0f8b9da1ce7c7ddb8891  Ai-Task-Manager-Mac-0.7.5.zip' | sha256sum -c -
          echo '98453f0b60360f4339f60a1ab63dd6f9c0d6447800a206a428b55c282a180444  Ai-Task-Manager-Source-0.7.5.zip' | sha256sum -c -
          echo '9a2fd4784cb90c8b219e5e8af48d7cfd7e504ab0e52effdd6ce084178ab1528b  appcast.xml' | sha256sum -c -
          sha256sum -c SHA256SUMS.txt
      - name: Publish signed Mac update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v0.7.5 assets/* --title 'Ai Task Manager 0.7.5' --latest --notes 'Fixes Codex history sorting and stale row summaries. Chats are ordered by their actual latest activity across native and dashboard tasks, including completed tasks. History rows show current messages instead of routing explanations, with normalized event timestamps. 53 UI and 6 portability tests passed; live history verified. Signed Mac update and editable source included.'
      - uses: actions/checkout@v4
        with:
          path: checkout
      - name: Import reviewed editable source
        run: |
          unzip -q assets/Ai-Task-Manager-Source-0.7.5.zip -d /tmp/reviewed-source
          cp -a /tmp/reviewed-source/Ai-Task-Manager-Source/. checkout/
          cd checkout
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Fix chat history and live synchronization in 0.7.5'
          git push



