name: Publish verified 0.14.2
on:
  push:
    paths: ['.github/workflows/publish-0.14.2.yml']
permissions:
  contents: write
concurrency:
  group: publish-0.14.2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and verify signed release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir assets
          cd assets
          for f in Ai-Task-Manager-Mac-0.14.2.zip Ai-Task-Manager-Source-0.14.2.zip Ai-Task-Manager-Migration-0.14.2.pkg appcast.xml appcast-neutral.xml SHA256SUMS.txt; do
            curl --fail --location --retry 3 --max-time 300 "https://plaintiff-performance-broadcast-hydrogen.trycloudflare.com/$f" -o "$f"
          done
          echo 'c6044cfe0719ff2bb0b562c795983f457df887e02b6b343c6f7f8551b0e5cfd8  Ai-Task-Manager-Mac-0.14.2.zip' | sha256sum -c -
          echo '2f4ff466741d0b58d789affe151531b630f2bfe91f1e00794afed25fa6ea301f  Ai-Task-Manager-Source-0.14.2.zip' | sha256sum -c -
          echo '109d1c343c6d9e9c35b81b2240ee6a398d043b62a226814b45123c3a5e045819  Ai-Task-Manager-Migration-0.14.2.pkg' | sha256sum -c -
          echo 'b037f5c4910dc9831f920c909985f3afd043fce1408d40756eb45615b0c3a164  appcast.xml' | sha256sum -c -
          echo '2779a51da1aaceedce492f493044105594e73733bf2bc5d6058070c4307a66c7  appcast-neutral.xml' | sha256sum -c -
          echo '3da5a60c7fafeeb0b7a14b132932afea1392771442e9f7458819f10d902bd32e  SHA256SUMS.txt' | sha256sum -c -
          sha256sum -c SHA256SUMS.txt
      - uses: actions/checkout@v4
        with:
          path: checkout
      - name: Import reviewed editable source
        run: |
          set -euo pipefail
          unzip -q assets/Ai-Task-Manager-Source-0.14.2.zip -d /tmp/reviewed-source
          rsync -a --delete --exclude=.git --exclude=.github /tmp/reviewed-source/Ai-Task-Manager-Source/ checkout/
          cd checkout
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Publish agent question popups, schedules, manager directives and neutral identity migration in 0.14.2'
          git push
      - name: Upload draft and publish complete update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          target=$(git -C checkout rev-parse HEAD)
          gh release create v0.14.2 assets/* --target "$target" --draft --title 'Ai Task Manager 0.14.2' --notes 'Agent questions now appear in an answerable popup with suggested choices and a Later option. Answers stay attached to the correct request and drafts survive live refreshes and failed sends. Adds a scheduled-work area with per-chat schedule visibility and persistent department operating directives that guide actual delegation. Uses neutral app identifiers and excludes private customer and owner data from release files. This one-time identity migration uses a signed installer and may ask for macOS administrator authorization. Local workspace and account data remain in place, and existing browser storage is copied without replacing newer data. Installation waits for unfinished dashboard work. Subsequent updates use the normal app updater. UI, privacy, migration, recipient-account isolation and package tests passed; native code and update signatures verified. GOD CHAT is not included in this release.'
          gh release edit v0.14.2 --draft=false --latest
