name: Publish verified 0.11.0
on:
  push:
    paths: ['.github/workflows/publish-0.11.0.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir assets
          cd assets
          for f in Ai-Task-Manager-Mac-0.11.0.zip Ai-Task-Manager-Source-0.11.0.zip appcast.xml SHA256SUMS.txt; do
            curl --fail --location --retry 3 --max-time 300 "https://portsmouth-analyses-draft-galleries.trycloudflare.com/$f" -o "$f"
          done
          echo 'fcb077a9de304b377629acb8f48418c2a8cfb18597057ebb6fa5fb97373464ed  Ai-Task-Manager-Mac-0.11.0.zip' | sha256sum -c -
          echo '9c0ce6f142c99bcf1c13bee0cd977e95705a00885597a641c66176f0c53acb32  Ai-Task-Manager-Source-0.11.0.zip' | sha256sum -c -
          echo '86b2155b43dac3d7e5e3af9aa52c90969fb2e2c7f5faf455a4cab295f404cb8b  appcast.xml' | sha256sum -c -
          echo '345860687ddf6d11801c8d7203cf9ec2ca2c4f90c8cc973529667ed15d8143d9  SHA256SUMS.txt' | sha256sum -c -
          sha256sum -c SHA256SUMS.txt
      - name: Publish signed Mac update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v0.11.0 assets/* --title 'Ai Task Manager 0.11.0' --latest --notes 'Answer pending Codex questions in Needs attention or their conversation. Choose Queue this or Steer now explicitly, including photos. Send now prioritizes waiting work while protecting occupied tasks and folders. Request inbox shows unfinished work. Rewster voice replies and internal reviews stay in history without flooding Completions. Ambient universe animation stays distinct from confirmed live status. Preserves existing steering receipts and OpenAI shortcuts. Verified with automated tests, packaged-engine checks, archive integrity and code-signature validation. Reuses the verified native shell with unchanged Swift source. Signed Sparkle update and editable source included.'
      - uses: actions/checkout@v4
        with:
          path: checkout
      - name: Import reviewed editable source
        run: |
          unzip -q assets/Ai-Task-Manager-Source-0.11.0.zip -d /tmp/reviewed-source
          cp -a /tmp/reviewed-source/Ai-Task-Manager-Source/. checkout/
          cd checkout
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Publish question inbox and explicit task delivery in 0.11.0'
          git push
