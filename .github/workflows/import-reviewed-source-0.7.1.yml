name: Import reviewed 0.7.1 source
on:
  push:
    paths: ['.github/workflows/import-reviewed-source-0.7.1.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and import source
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/AndrewEller12-source/Andrews-Ai-Brain/releases/download/v0.7.1/Ai-Task-Manager-Source-0.7.1.zip -o /tmp/source.zip
          echo '5c21f01367953b869f9d862e6a718ab6f180bf2942e0db0693768a7e4024ad65  /tmp/source.zip' | sha256sum -c -
          unzip -q /tmp/source.zip -d /tmp/reviewed-source
          cp -a /tmp/reviewed-source/Ai-Task-Manager-Source/. .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Import reviewed editable Ai Task Manager 0.7.1 source'
          git push
