name: Publish verified 0.9.2
on:
  push:
    paths: ['.github/workflows/publish-0.9.2.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir assets
          cd assets
          for f in Ai-Task-Manager-Mac-0.9.2.zip Ai-Task-Manager-Source-0.9.2.zip appcast.xml SHA256SUMS.txt; do
            curl --fail --location --retry 3 --max-time 300 "https://algorithms-reputation-cabin-anybody.trycloudflare.com/$f" -o "$f"
          done
          echo '74f559d0bf51a7bd4d9144d824eac8cf0acb0f05517004e151786217810e1f5f  Ai-Task-Manager-Mac-0.9.2.zip' | sha256sum -c -
          echo '0bf6489be07b92894ad3c695daf4aab47dabceb4b7298cf9750f4966a7feeb63  Ai-Task-Manager-Source-0.9.2.zip' | sha256sum -c -
          echo '3cbee54b1786a8d0eed02eb7e5e4b95c37d0dd019d0d089ffb95eeb5910ca074  appcast.xml' | sha256sum -c -
          sha256sum -c SHA256SUMS.txt
      - name: Publish signed Mac update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v0.9.2 assets/* --title 'Ai Task Manager 0.9.2' --latest --notes 'Working sub-agents now stay visibly alive with a continuous lavender orb pulse and moving orbit that differs from the main agent pulse. Each live child is explicitly labeled Sub-agent working, exposes an accessible status, and falls back to a static double-ring indicator when reduced motion is enabled. The universe brain layout is also larger and more spread out for easier scanning. Verified with all 198 tests, a successful macOS Release build, strict code-signature validation, and an isolated clean-recipient runtime check. Signed Mac update and editable source included.'
      - uses: actions/checkout@v4
        with:
          path: checkout
      - name: Import reviewed editable source
        run: |
          unzip -q assets/Ai-Task-Manager-Source-0.9.2.zip -d /tmp/reviewed-source
          cp -a /tmp/reviewed-source/Ai-Task-Manager-Source/. checkout/
          cd checkout
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Publish persistent sub-agent activity in 0.9.2'
          git push
